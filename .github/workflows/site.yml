name: Deploy Site to Cloudflare Pages

on:
  schedule:
    - cron: '0 6 * * *'  # Nightly, 06:00 UTC
  workflow_dispatch:
    inputs:
      force_rescan:
        description: 'Re-scan all images even if cached'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-site-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-site-

      - name: Cache scan store
        uses: actions/cache@v4
        with:
          path: scans.db
          key: scan-store-${{ hashFiles('wiimi-site.toml') }}-${{ github.run_number }}
          restore-keys: |
            scan-store-${{ hashFiles('wiimi-site.toml') }}-
            scan-store-

      - name: Build wiimi
        run: cargo build --release

      - name: Discover and scan new images
        run: |
          ARGS="--config wiimi-site.toml --db scans.db --no-cache"
          if [ "${{ inputs.force_rescan }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          ./target/release/wiimi discover $ARGS

      - name: Generate site
        run: ./target/release/wiimi site --config wiimi-site.toml --db scans.db

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=wiimi --branch=main
