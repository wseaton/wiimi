<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- GPU chip body -->
  <rect x="14" y="14" width="36" height="36" rx="4" fill="#060d14" stroke="#96650f" stroke-width="2"/>
  <!-- Pins left -->
  <rect x="8" y="20" width="8" height="3" rx="1" fill="#0f9c8a"/>
  <rect x="8" y="27" width="8" height="3" rx="1" fill="#0f9c8a"/>
  <rect x="8" y="34" width="8" height="3" rx="1" fill="#0f9c8a"/>
  <rect x="8" y="41" width="8" height="3" rx="1" fill="#0f9c8a"/>
  <!-- Pins right -->
  <rect x="48" y="20" width="8" height="3" rx="1" fill="#0f9c8a"/>
  <rect x="48" y="27" width="8" height="3" rx="1" fill="#0f9c8a"/>
  <rect x="48" y="34" width="8" height="3" rx="1" fill="#0f9c8a"/>
  <rect x="48" y="41" width="8" height="3" rx="1" fill="#0f9c8a"/>
  <!-- Pins top -->
  <rect x="20" y="8" width="3" height="8" rx="1" fill="#0f9c8a"/>
  <rect x="27" y="8" width="3" height="8" rx="1" fill="#0f9c8a"/>
  <rect x="34" y="8" width="3" height="8" rx="1" fill="#0f9c8a"/>
  <rect x="41" y="8" width="3" height="8" rx="1" fill="#0f9c8a"/>
  <!-- Pins bottom -->
  <rect x="20" y="48" width="3" height="8" rx="1" fill="#0f9c8a"/>
  <rect x="27" y="48" width="3" height="8" rx="1" fill="#0f9c8a"/>
  <rect x="34" y="48" width="3" height="8" rx="1" fill="#0f9c8a"/>
  <rect x="41" y="48" width="3" height="8" rx="1" fill="#0f9c8a"/>
  <!-- Magnifying glass -->
  <circle cx="30" cy="30" r="8" fill="none" stroke="#96650f" stroke-width="2.5"/>
  <line x1="36" y1="36" x2="44" y2="44" stroke="#96650f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ? mark -->
  <text x="30" y="34" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f6f8fa">?</text>
</svg>
