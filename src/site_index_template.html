<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*SITE_TITLE*/</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="/*OG_DESCRIPTION*/">
<meta property="og:title" content="/*OG_TITLE*/">
<meta property="og:description" content="/*OG_DESCRIPTION*/">
<meta property="og:image" content="/*OG_IMAGE*/">
<meta property="og:type" content="/*OG_TYPE*/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="/*OG_TITLE*/">
<meta name="twitter:description" content="/*OG_DESCRIPTION*/">
<meta name="twitter:image" content="/*OG_IMAGE*/">
<style>
/*BASE_STYLES*/

.catalog-header {
  padding: 24px 32px 16px;
  border-bottom: 1px solid var(--border);
}
.catalog-header h1 {
  margin: 0;
  font-size: 1.3rem;
  color: var(--accent);
}
.catalog-header p {
  margin: 6px 0 0;
  font-size: 0.85rem;
  color: var(--muted);
}

.family-section {
  padding: 24px 32px;
  border-bottom: 1px solid var(--border);
}
.family-section:last-child {
  border-bottom: none;
}
.family-name {
  font-size: 1.1rem;
  color: var(--text);
  margin: 0 0 16px;
}

.scan-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
  margin-bottom: 20px;
}
.scan-table th {
  text-align: left;
  padding: 6px 12px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  font-weight: normal;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.scan-table td {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
.scan-table tr:hover td {
  background: var(--surface);
}
.scan-table a {
  color: var(--accent);
  text-decoration: none;
}
.scan-table a:hover {
  text-decoration: underline;
}

.ptx-yes { color: var(--green); }
.ptx-no  { color: var(--red); }

.diff-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.diff-controls label {
  color: var(--muted);
  font-size: 0.8rem;
}
.diff-controls select {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 4px 8px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 0.82rem;
}
.diff-controls select:focus {
  outline: none;
  border-color: var(--accent);
}
.diff-controls button {
  background: var(--accent);
  color: var(--bg);
  border: none;
  padding: 5px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: bold;
}
.diff-controls button:hover {
  opacity: 0.9;
}
.diff-controls button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.footer {
  padding: 16px 32px;
  text-align: center;
  color: var(--muted);
  font-size: 0.75rem;
}
.footer a {
  color: var(--accent);
  text-decoration: none;
}
</style>
</head>
<body>

<div class="catalog-header">
  <h1>/*SITE_TITLE*/</h1>
  <p>Generated by <a href="https://github.com/wseaton/wiimi" style="color: var(--accent); text-decoration: none;">wiimi</a></p>
</div>

/*FAMILY_SECTIONS*/

<div class="footer">
  Powered by <a href="https://github.com/wseaton/wiimi">wiimi</a> &mdash; WTF Is In My Image
</div>

<script>
var SITE_DATA = /*SITE_DATA*/null;

document.querySelectorAll('.diff-go-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var section = btn.closest('.family-section');
    var fromSel = section.querySelector('.diff-from');
    var toSel = section.querySelector('.diff-to');
    var from = fromSel.value;
    var to = toSel.value;
    if (!from || !to || from === to) return;

    var familyIdx = section.dataset.familyIdx;
    var family = SITE_DATA.families[familyIdx];
    var key = from + '|' + to;
    var url = family.diff_urls[key];
    if (url) {
      window.location.href = url;
    }
  });
});

// Disable button when from === to or either is empty
document.querySelectorAll('.diff-from, .diff-to').forEach(function(sel) {
  sel.addEventListener('change', function() {
    var section = sel.closest('.family-section');
    var fromSel = section.querySelector('.diff-from');
    var toSel = section.querySelector('.diff-to');
    var btn = section.querySelector('.diff-go-btn');
    btn.disabled = !fromSel.value || !toSel.value || fromSel.value === toSel.value;
  });
});
</script>
</body>
</html>
