title = "wiimi GPU Image Catalog"
output_dir = "_site"
base_url = "https://wiimi.wseaton.com"

[[family]]
name = "llm-d CUDA"
registry = "ghcr.io"
repository = "llm-d/llm-d-cuda"
tag_pattern = '^v\d+\.\d+\.\d+(-rc\.\d+)?$'

[[family]]
name = "vLLM Community Images"
registry = "docker.io"
repository = "vllm/vllm-openai"
tag_pattern = '^v\d+\.\d+\.\d+$'
last_n = 10
order_by = "semver"

[[family]]
name = "Red Hat Community Images"
registry = "quay.io"
repository = "vllm/vllm-cuda"
tag_pattern = '^\d+\.\d+\.\d+_rhai\d+$'
last_n = 10
order_by = "semver_build"
build_separator = "_rhai"
