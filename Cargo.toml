[package]
name = "wiimi"
version = "0.1.0"
edition = "2021"
description = "WTF Is In My Image - GPU image scanning toolkit"
license = "Apache-2.0"
repository = "https://github.com/wseaton/wiimi"

[[bin]]
name = "wiimi"
path = "src/main.rs"

[dependencies]
# OCI
oci-client = "0.14"
docker_credential = "1"

# Binary parsing
goblin = "0.9"
fatbinary = "0.3"
memchr = "2"

# Archive / compression
tar = "0.4"
flate2 = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
toml = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IO
tokio-util = { version = "0.7", features = ["io-util"] }

# Progress
indicatif = "0.17"

# Error handling
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# SQLite (RPM database parsing)
rusqlite = { version = "0.34", features = ["bundled"] }

# Regex
regex = "1"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Filesystem
tempfile = "3"
dirs = "6"

# OG image rendering (SVG -> PNG)
resvg = "0.44"

# Base64 encoding (favicon data URIs)
base64 = "0.22"

# Templating
minijinja = { version = "2", features = ["builtins"] }

# Version parsing
semver = "1"
